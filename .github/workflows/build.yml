name: Compilar Executavel Windows

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas easygui xlsxwriter pyinstaller openpyxl

    - name: Gerar executavel com PyInstaller
      run: |
        pyinstaller --noconsole --onefile Caixa.py

    - name: Salvar o .exe gerado
      uses: actions/upload-artifact@v4
      with:
        name: Caixa-Executavel
        path: dist/Caixa.exe
